  <style>
    * {
      box-sizing: border-box;

      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, sans-serif;
    }

    body {

      color: #f8fafc;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 950px;
      margin: auto;
    }

    /* =========================
       HEADER
       ========================= */

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .connection {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
    }

    /* =========================
       SUMMARY
       ========================= */

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .summary-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 18px;
      text-align: center;
    }

    .summary-title {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 2rem;
      font-weight: 800;
    }

    /* =========================
       PARKING GRID
       ========================= */

    .parking-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .parking-card {
      background: #1e293b;
      border-radius: 24px;
      padding: 25px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .slot-title {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 18px;
    }

    /* =========================
       DISTANCE
       ========================= */

    .display-box {
      background: #0f172a;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      border: 1px solid #334155;
      margin-bottom: 18px;
    }

    .value {
      font-size: 3.2rem;
      font-weight: 800;
      color: #38bdf8;
      line-height: 1.1;
    }

    .unit {
      font-size: 1.1rem;
      color: #64748b;
      margin-left: 4px;
    }

    .secondary-val {
      font-size: 1rem;
      color: #94a3b8;
      margin-top: 8px;
    }

    /* =========================
       METER
       ========================= */

    .meter-container {
      background: #334155;
      height: 12px;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .meter-bar {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      width: 0%;
      transition: width 0.2s ease;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #64748b;
    }

    /* =========================
       STATUS
       ========================= */

    .status-badge {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      text-align: center;
      margin-top: 18px;
    }

    .status-free {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid #22c55e;
    }

    .status-occupied {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid #ef4444;
    }

    .status-out {
      background: rgba(234, 179, 8, 0.15);
      color: #facc15;
      border: 1px solid #eab308;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 700px) {

      .parking-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .value {
        font-size: 2.8rem;
      }
    }

  </style>
</head>

  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script>

    /*
     * MQTT Topics
     */

    const MQTT_TOPICS = {

      A1: "esp32_parking_project/slot_A1",

      A2: "esp32_parking_project/slot_A2"

    };


    /*
     * เก็บสถานะของแต่ละช่อง
     */

    const slots = {

      A1: {
        occupied: false,
        received: false
      },

      A2: {
        occupied: false,
        received: false
      }

    };


    /*
     * เชื่อมต่อ HiveMQ
     */

    const client = mqtt.connect(
      "wss://broker.hivemq.com:8884/mqtt"
    );


    /*
     * เมื่อเชื่อมต่อสำเร็จ
     */

    client.on("connect", () => {

      document.getElementById(
        "conn-status"
      ).innerText =
        "Online (เชื่อมต่อสำเร็จ)";

      document.getElementById(
        "live-dot"
      ).style.background =
        "#22c55e";


      /*
       * Subscribe A1
       */

      client.subscribe(
        MQTT_TOPICS.A1,
        (err) => {

          if (err) {

            console.error(
              "Subscribe A1 error:",
              err
            );

          } else {

            console.log(
              "Subscribed:",
              MQTT_TOPICS.A1
            );

          }

        }
      );


      /*
       * Subscribe A2
       */

      client.subscribe(
        MQTT_TOPICS.A2,
        (err) => {

          if (err) {

            console.error(
              "Subscribe A2 error:",
              err
            );

          } else {

            console.log(
              "Subscribed:",
              MQTT_TOPICS.A2
            );

          }

        }
      );

    });



    /*
     * เมื่อได้รับข้อมูล MQTT
     */

    client.on("message", (topic, payload) => {

      try {

        const data =
          JSON.parse(
            payload.toString()
          );


        /*
         * หาว่าข้อมูลมาจากช่องไหน
         */

        let slot = null;


        if (
          topic === MQTT_TOPICS.A1
        ) {

          slot = "A1";

        }

        else if (
          topic === MQTT_TOPICS.A2
        ) {

          slot = "A2";

        }


        /*
         * ถ้าไม่ใช่ Topic ของเรา
         */

        if (!slot) {
          return;
        }


        /*
         * บันทึกสถานะ
         */

        slots[slot].received = true;

        slots[slot].occupied =
          data.occupied;


        /*
         * อ้างอิง Element
         */

        const cm =
          document.getElementById(
            "dist-cm-" + slot
          );

        const mm =
          document.getElementById(
            "dist-mm-" + slot
          );

        const meter =
          document.getElementById(
            "meter-bar-" + slot
          );

        const status =
          document.getElementById(
            "status-card-" + slot
          );


        /*
         * Sensor Out of Range
         */

        if (data.status === 4) {

          cm.innerText = ">200";

          mm.innerText = "Out";

          meter.style.width = "100%";

          status.className =
            "status-badge status-out";

          status.innerText =
            "⚠️ เกินระยะตรวจจับ";

        }


        /*
         * Sensor ปกติ
         */

        else {

          cm.innerText =
            Number(data.cm).toFixed(1);

          mm.innerText =
            data.mm;


          /*
           * Meter
           */

          let pct =
            Math.min(
              (data.mm / 2000) * 100,
              100
            );

          meter.style.width =
            pct + "%";


          /*
           * สถานะช่อง
           */

          if (data.occupied) {

            status.className =
              "status-badge status-occupied";

            status.innerText =
              "🔴 มีรถจอด (Occupied)";

          }

          else {

            status.className =
              "status-badge status-free";

            status.innerText =
              "🟢 ที่ว่าง (Empty)";

          }

        }


        /*
         * อัปเดตจำนวนช่อง
         */

        updateSummary();

      }

      catch (e) {

        console.error(
          "Data parse error:",
          e
        );

      }

    });



    /*
     * อัปเดตสรุปจำนวนช่อง
     */

    function updateSummary() {

      let free = 0;

      let occupied = 0;


      Object.keys(slots).forEach(
        (slot) => {

          /*
           * นับเฉพาะช่องที่ได้รับข้อมูลแล้ว
           */

          if (
            !slots[slot].received
          ) {
            return;
          }


          if (
            slots[slot].occupied
          ) {

            occupied++;

          }

          else {

            free++;

          }

        }
      );


      document.getElementById(
        "free-slots"
      ).innerText = free;


      document.getElementById(
        "occupied-slots"
      ).innerText = occupied;

    }



    /*
     * MQTT หลุด
     */

    client.on("close", () => {

      document.getElementById(
        "conn-status"
      ).innerText =
        "Offline (ขาดการเชื่อมต่อ)";

      document.getElementById(
        "live-dot"
      ).style.background =
        "#ef4444";

    });


    /*
     * MQTT Error
     */

    client.on("error", (error) => {

      console.error(
        "MQTT Error:",
        error
      );

    });

  </script>

</body>
</html>
